services:
  postgres:
    image: postgres:16
    container_name: uniswap_indexer_postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: rindexer_uniswapv4indexer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: uniswap_indexer_redis
    ports:
      - "6380:6379"

  rindexer:
    image: ghcr.io/joshstevens19/rindexer:latest
    platform: linux/amd64
    container_name: uniswap_indexer_rindexer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/rindexer_uniswapv4indexer
      - ARB_MAINNET_RPC=${ARB_MAINNET_RPC}
      - REDIS_CONNECTION_URI=redis://redis:6379
    volumes:
      - .:/workspace
    working_dir: /workspace
    entrypoint: ["/app/rindexer"]
    command: ["start", "indexer"]

volumes:
  postgres_data: